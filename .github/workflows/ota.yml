name: OTA design review
on:
  pull_request:
  push:
    tags: ['v0.1.0', 'v0.1.1', 'v0.1.2', 'v0.1.3']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schematic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Viewer drawing against the simulation netlist
        run: |
          archive=rnl-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 "https://github.com/rich-netlist/rnl/releases/download/core-v0.6.2/$archive" -o "$RUNNER_TEMP/$archive"
          echo "bba0575cd8c40d8973862e0d1740e4d860b9370aa14c3017005550de3d1415d7  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" rnl
          export PATH="$RUNNER_TEMP:$PATH"
          rnl check round3/ota.rnl.sp
          python3 sim/check_schematic.py
  replay:
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 25
    env:
      DEBIAN_FRONTEND: noninteractive
      MPLCONFIGDIR: /tmp/ota-mpl
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install simulator and report dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ngspice python3-numpy python3-matplotlib texlive-publishers texlive-fonts-recommended lmodern texlive-latex-recommended poppler-utils
          ngspice --version
      - name: Verify original inputs
        run: sha256sum -c audit/inputs.sha256
      - name: Reproduce nominal, PVT and mismatch measurements
        run: python3 sim/review.py replay
      - name: Run the seven bias and common-mode testbench checks
        run: |
          python3 sim/bias_review.py bias-review
          python3 sim/bias_plots.py bias-review bias-review/observations.png
      - name: Archive the bias testbenches, logs and raw measurements
        uses: actions/upload-artifact@v4
        with:
          name: bias-review
          path: bias-review/
          if-no-files-found: error
      - name: Rebuild report
        run: |
          python3 report/figures.py
          cd report
          rm -f ota.pdf
          pdflatex -halt-on-error -interaction=batchmode ota.tex
          pdflatex -halt-on-error -interaction=batchmode ota.tex
          pages=$(pdfinfo ota.pdf | awk '/^Pages/{print $2}')
          test "$pages" -ge 1 && test "$pages" -le 6
      - name: Save replay measurements and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ota-review
          path: |
            replay/
            report/ota.pdf
            report/ota.log
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [replay, schematic]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ota-review
          path: verified-replay
      - uses: actions/download-artifact@v4
        if: github.ref_name == 'v0.1.2' || github.ref_name == 'v0.1.3'
        with:
          name: bias-review
          path: verified-bias
      - name: Publish verified design assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd verified-replay && zip -qr ../actions-replay.zip .)
          if [ -d verified-bias ]; then
            (cd verified-bias && zip -qr ../bias-review.zip .)
            if [ "$GITHUB_REF_NAME" = v0.1.3 ]; then
              title="v0.1.3 · OTA 原理图布局修订"
              notes="Mref 与 Mtail 同高，栅极水平直连。偏置支路左移，供电垂直接入；上方电源标记居中，下方共模检测标签拉开。附件含对应的 RNL、SVG、PNG 及本次复跑数据。上一版图纸保存在 v0.1.2。"
            else
              title="v0.1.2 · OTA 七项偏置与共模复核"
              notes="补测第三版 OTA 的 40 组逐管工作点、20 个失配样本、大信号与共模环路。四个假设 SS/SF、85 °C 工作点的尾管饱和余量为负，最低 −3.28 mV。bias-review.zip 含测试网表、模型假设、频响、瞬态和日志。原设计可按 v0.1.1 复现。见 [测量定义及边界](https://github.com/DestinySky1/Analog_Design_Test_OPAMP/blob/v0.1.2/audit/bias/README.md)。"
            fi
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --generate-notes --notes "$notes" bias-review.zip round3/ota.rnl.sp round3/ota.rnl.svg round3/ota.rnl.png verified-replay/report/ota.pdf audit/nominal.zip actions-replay.zip
          elif [ "$GITHUB_REF_NAME" = v0.1.1 ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "v0.1.1 · 最终 OTA 网表与原理图" --generate-notes --notes-file audit/schematic-release.md round3/ota.rnl.sp round3/ota.rnl.svg round3/ota.rnl.png verified-replay/report/ota.pdf audit/nominal.zip actions-replay.zip
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "v0.1.0 · 180 nm 全差分 OTA 三轮设计" --notes-file audit/release-notes.md verified-replay/report/ota.pdf audit/nominal.zip actions-replay.zip
          fi
